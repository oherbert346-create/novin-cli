[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novin"
version = "1.0.0"
description = "Novin local terminal. Runs on your machine."
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "rich>=13",
  "textual>=0.89,<1",
]

[project.scripts]
novin = "novin.cli:main"

[tool.setuptools.packages.find]
include = ["novin*"]
